# Push a tag like v1.2.0 to build all platforms and publish a GitHub release.
# install.sh and install.ps1 download from the latest release.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: ./build.sh "${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/gitswitch-*
            dist/SHA256SUMS
