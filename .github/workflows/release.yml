# Push a tag like v1.2.0 to build all platforms and publish a GitHub release.
# install.sh and install.ps1 download from the latest release.
# The desktop window needs cgo on macOS and Linux, so each of those builds on
# its own runner; Windows builds on Linux without cgo. Linux builds on the
# oldest supported Ubuntu, because a program linked against a newer glibc
# does not start on older systems.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read # only the publish job may write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - run: go vet ./...
      - run: go test -count=1 ./...
  build:
    needs: test
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            targets: linux/amd64 windows/amd64 windows/arm64
          - runner: ubuntu-22.04-arm
            targets: linux/arm64
          - runner: macos-latest
            targets: darwin/amd64 darwin/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - name: desktop window libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: ./build.sh "${GITHUB_REF_NAME}" ${{ matrix.targets }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.runner }}
          path: dist/gitswitch-*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its files
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: docs/release-notes
      - name: release notes
        # docs/release-notes/<tag>.md, or a pointer to the commits when there is none
        run: |
          f="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then cp "$f" "$RUNNER_TEMP/notes.md"
          else echo "See the commits: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" > "$RUNNER_TEMP/notes.md"; fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum gitswitch-* > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: ${{ runner.temp }}/notes.md
          files: |
            dist/gitswitch-*
            dist/SHA256SUMS
