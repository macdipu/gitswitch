# Runs the full test suite on Linux, macOS and Windows for every push and
# pull request. The tests run real `git clone/pull/push` through gitswitch.
name: test
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - name: build every platform
        run: |
          go build -o /dev/null ./cmd/gitswitch
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/gitswitch
          GOOS=darwin GOARCH=arm64 go build -o /dev/null ./cmd/gitswitch
          GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/gitswitch
        shell: bash
      - name: desktop window libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: build with the desktop window
        run: |
          tags=desktop,production
          [ "$RUNNER_OS" = Linux ] && tags=$tags,webkit2_41
          go build -tags "$tags" -o /dev/null ./cmd/gitswitch
          go vet -tags "$tags" ./internal/interfaces/desktop/...
        shell: bash
      - run: go test -count=1 -v ./...
      - name: race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...
